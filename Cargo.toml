[package]
name = "darkharness"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust application skeleton wired for agent-driven development."
license = "MIT OR Apache-2.0"
repository = "https://github.com/br00-uk/darkharness"
publish = false

[lib]
name = "darkharness"
path = "src/lib.rs"

[[bin]]
name = "darkharness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
# Additional crates go here as the project grows, e.g. members = ["crates/*"].
# Keeping the root package in a workspace means `[workspace.lints]` below is the
# single place lint policy is defined, for this crate and every future member.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Noisy pedantic lints that fight idiomatic code more than they help.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
