[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/br00-uk/darkharness"
publish = false

# The harness links large native dependencies. Optimising dependencies while
# leaving our own crates at opt-level 1 keeps the debug build usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
# Workspace crates.
dark-agentsmd = { path = "crates/dark-agentsmd" }
dark-airlock = { path = "crates/dark-airlock" }
dark-cartograph = { path = "crates/dark-cartograph" }
dark-config = { path = "crates/dark-config" }
dark-contract = { path = "crates/dark-contract" }
dark-core = { path = "crates/dark-core" }
dark-engine = { path = "crates/dark-engine" }
dark-engine-fake = { path = "crates/dark-engine-fake" }
dark-explore = { path = "crates/dark-explore" }
dark-lexicon = { path = "crates/dark-lexicon" }
dark-plan = { path = "crates/dark-plan" }
dark-qwen = { path = "crates/dark-qwen" }
dark-tools = { path = "crates/dark-tools" }
dark-tui = { path = "crates/dark-tui" }

# Shared third-party versions.
anyhow = "1"
async-trait = "0.1"
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tokio-util = "0.7"
toml = "0.9"
ulid = { version = "1", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
