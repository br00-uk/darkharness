[package]
name = "dark-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The dark binary."

# The binary is named `dark`. Do not name it `dh`: that shadows the Debian
# helper tool.
[[bin]]
name = "dark"
path = "src/main.rs"

# The three release artefacts from the README's "Build artefacts" table.
# `dark doctor` reads these at compile time (Rule 18) to know which
# artefact this binary is, and warns when it does not match the detected
# accelerator. Task unit J4 wires `cuda` and `metal` through to
# `dark-engine`'s own features when it builds the release pipeline; until
# then they carry no dependency, only the `cfg` that `doctor` reads.
[features]
cuda = []
metal = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
dark-agentsmd.workspace = true
dark-contract.workspace = true
dark-core.workspace = true
dirs.workspace = true
# `dark stats` (task unit J6) renders to a `ratatui::backend::TestBackend`
# and prints the result as text; it is not a live terminal application, so
# it needs none of the interactive backends `dark-tui` pulls in.
ratatui = { version = "=0.29.0", default-features = false }
sysinfo = "0.36.1"
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
