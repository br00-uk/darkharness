[package]
name = "dark-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The dark binary."

# `cargo-dist` will not package a binary from a crate whose manifest does
# not opt in (every crate inherits `publish = false` above, which `dist`
# reads as "do not distribute this"). See docs/adr/0005 and
# dist-workspace.toml's own top comment, both written expecting this
# stanza to land with task units B2 to B7.
[package.metadata.dist]
dist = true

# The binary is named `dark`. Do not name it `dh`: that shadows the Debian
# helper tool.
[[bin]]
name = "dark"
path = "src/main.rs"

# The three release artefacts from the README's "Build artefacts" table.
# `dark doctor` reads the `cfg` these features set (Rule 18) to know which
# artefact this binary is, and warns when it does not match the detected
# accelerator. Task units B2 to B7 close the gap ADR 0005 deferred: these
# now forward to `dark-engine`'s own identically-named features, which in
# turn forward to mistralrs's. This unblocks the `dark-metal`/`dark-cuda`
# jobs in `.github/workflows/release.yml`, which were disabled pending
# this wiring; see docs/adr/0006.
[features]
cuda = ["dark-engine/cuda"]
flash-attn = ["dark-engine/flash-attn"]
metal = ["dark-engine/metal"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
dark-acp.workspace = true
dark-agentsmd.workspace = true
dark-airlock.workspace = true
dark-cartograph.workspace = true
dark-config.workspace = true
dark-contract.workspace = true
dark-core.workspace = true
dark-engine.workspace = true
dark-explore.workspace = true
dark-lexicon.workspace = true
dark-qwen.workspace = true
dark-tools.workspace = true
dark-tui.workspace = true
dirs.workspace = true
futures-util.workspace = true
# `dark stats` (task unit J6) needs only `ratatui::backend::TestBackend`,
# so this crate's own entry keeps default features off. `dark replay`
# (task unit H5) needs the live `crossterm` backend for its terminal loop;
# it gets one anyway, because `dark-tui` above pulls in `ratatui` with
# default features, and Cargo unifies the two into one build of the same
# crate version. `default-features = false` here is therefore about what
# this crate declares needing on its own, not a claim that the interactive
# backends are absent from the final binary.
ratatui = { version = "=0.29.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
sysinfo = "0.36.1"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }
tokio-util.workspace = true
toml.workspace = true
ulid.workspace = true

[lints]
workspace = true

[dev-dependencies]
dark-engine-fake.workspace = true
tempfile.workspace = true
