[package]
name = "dark-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Loads models, runs inference, and manages the resident set."

# The three release artefacts (README's "Build artefacts" table, Rule 18).
# Feature names match mistralrs's own, so this crate only forwards them; see
# docs/adr/0006. `dark-cli`'s own `cuda`/`metal`/`flash-attn` features
# forward to these in turn.
[features]
cuda = ["mistralrs/cuda"]
flash-attn = ["mistralrs/flash-attn"]
metal = ["mistralrs/metal"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
dark-airlock.workspace = true
dark-contract.workspace = true
futures-core.workspace = true
futures-util.workspace = true
mistralrs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sysinfo = "0.36"
tokenizers = { version = "=0.22.2", default-features = false }
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
ulid.workspace = true

[lints]
workspace = true

[dev-dependencies]
dark-engine-fake.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }
