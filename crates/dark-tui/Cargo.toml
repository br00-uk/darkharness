[package]
name = "dark-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The full-screen terminal application."

[dependencies]
dark-contract.workspace = true
# There is no direct `crossterm` entry on purpose. `ratatui` pins its own
# `crossterm` and re-exports it, so this crate reads input through
# `ratatui::crossterm`. A second, directly declared `crossterm` resolves to a
# different version and produces type errors that name the same type twice.
# See Do step 1 of task unit `H1`.
ratatui = "0.29.0"
unicode-width = "0.2"

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
