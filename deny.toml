# Dependency policy for the darkharness workspace.
#
# The bans below make Rule 13 machine-checkable: only `dark-airlock` may reach
# the network. `cargo xtask check-deps` enforces the same rule over direct
# dependencies; this file also catches a transitive HTTP client that arrives
# through some other crate.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# The harness ships as a binary. Keep to licences that permit that without a
# per-file notice obligation.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # webpki-roots ships the Mozilla CA trust anchors that rustls verifies
    # against. CDLA-Permissive-2.0 is a data licence and permits
    # redistribution inside a binary.
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates are unpublished path dependencies, so they carry no
# version requirement. That is not the wildcard this check looks for.
allow-wildcard-paths = true
# Rule 13. An HTTP client may appear only underneath dark-airlock.
deny = [
    { name = "reqwest", wrappers = ["dark-airlock"] },
    # hyper reaches the graph only underneath reqwest, through its own
    # connector crates. Naming them keeps the ban meaningful: hyper appearing
    # under anything else still fails.
    { name = "hyper", wrappers = ["dark-airlock", "reqwest", "hyper-util", "hyper-rustls"] },
    { name = "ureq", wrappers = ["dark-airlock"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
